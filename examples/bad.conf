# A configuration that looks reasonable and has five production bugs.

worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream app { server 127.0.0.1:3000; }

    # Two server blocks claiming the same name. Only the first one ever answers.
    server {
        listen 80;
        server_name example.com;

        add_header Strict-Transport-Security "max-age=31536000";
        add_header X-Frame-Options "DENY";

        # The location prefix has no trailing slash, the proxy_pass does.
        # /api/users is rewritten to /users.
        location /api {
            proxy_pass http://app/;
        }

        # A nested add_header drops both server-level headers above.
        location /assets/ {
            alias /var/www/assets;
            add_header Cache-Control "public, max-age=86400";
        }
    }

    server {
        listen 80;
        server_name example.com;

        location / {
            root /var/www/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # listen ssl with no certificate: nginx will not start.
    server {
        listen 443 ssl;
        server_name shop.example.com;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        # Variable upstream without a resolver.
        location /v1/ {
            proxy_pass http://$backend/;
            if ($request_method = POST) {
                proxy_pass http://app;
            }
        }
    }
}
