[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-doctor"
version = "0.1.0"
description = "Lint an nginx config and explain each finding: proxy_pass traps, header inheritance, TLS defaults."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["nginx", "devops", "linter", "configuration", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/nginx-doctor"

[project.scripts]
nginx-doctor = "nginxdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["nginxdoctor*"]
